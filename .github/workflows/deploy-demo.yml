name: Deploy demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - run: pnpm install

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Project pages are served under the repository name, which the demo
      # itself shouldn't hard-code, so the site address is set on a copy.
      - name: Prepare the demo event
        run: |
          cp -r examples/demo "$RUNNER_TEMP/demo"
          jq --arg url "$SITE_URL" '.url = $url' \
            examples/demo/concarte.json > "$RUNNER_TEMP/demo/concarte.json"
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - run: pnpm build
        env:
          CONCARTE_EVENT_DIR: ${{ runner.temp }}/demo

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
