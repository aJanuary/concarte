name: Validate use links in README.md

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/validate-use-links.yml"
      - "scripts/validate-use-links.ts"

permissions:
  contents: read

jobs:
  validate-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Validate use links in README.md
        run: pnpm tsx scripts/validate-use-links.ts
