appId: dev.concarte.editor
productName: ConCarte Editor
# The site is copied out of the app and built, so its files must stay real
# files rather than sit inside an archive.
asar: false
npmRebuild: false
files:
  - "**/*"
  - "!**/*.map"
linux:
  icon: icon.png
  target: AppImage
  category: Utility
mac:
  icon: icon.png
  target: dmg
  category: public.app-category.productivity
  # Ad-hoc signed: without a Developer ID the build is otherwise unsigned, and
  # Apple Silicon reports an unsigned download as damaged rather than offering
  # to open it.
  identity: "-"
win:
  icon: icon.png
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
